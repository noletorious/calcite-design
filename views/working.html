<h2>Basic Components</h2>
<p>Critical Calcite components. Copy any block into your own page.</p>

<div class="section">
  <h3>Button</h3>
  <calcite-button>Default</calcite-button>
  <calcite-button kind="brand">Brand</calcite-button>
  <calcite-button kind="danger" appearance="outline">Danger</calcite-button>
  <calcite-button icon-start="plus">With icon</calcite-button>
  <calcite-button disabled>Disabled</calcite-button>
</div>

<div class="section">
  <h3>Icon</h3>
  <calcite-icon icon="check" scale="s"></calcite-icon>
  <calcite-icon icon="star" scale="m"></calcite-icon>
  <calcite-icon icon="gear" scale="l"></calcite-icon>
</div>

<div class="section">
  <h3>Input</h3>
  <calcite-input label="Name" placeholder="Enter a name"></calcite-input>
</div>

<div class="section">
  <h3>Checkbox and switch</h3>
  <calcite-checkbox checked></calcite-checkbox>
  <calcite-switch checked></calcite-switch>
</div>

<div class="section">
  <h3>Slider</h3>
  <calcite-slider min="0" max="100" value="40" label-handles></calcite-slider>
</div>

<div class="section">
  <h3>Notice</h3>
  <calcite-notice open kind="success">
    <div slot="message">Saved successfully.</div>
  </calcite-notice>
</div>

<div class="section">
  <h3>Card</h3>
  <calcite-card>
    <h3 slot="title">Card title</h3>
    <span slot="subtitle">Supporting text</span>
    <p>Card body content goes here.</p>
  </calcite-card>
</div>
