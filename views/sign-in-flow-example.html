<head>
  <style>
    .content-panel {
      position: absolute;
      height: auto;
      min-height: 20rem;
      max-height: 90vh;
      width: 28rem;
      max-width: 90vw;
      margin: 0 auto;
      top: 50%;
      left: 50%;
      transform: translateY(-50%) translateX(-50%);
      box-shadow: var(--calcite-shadow-sm);
      --calcite-panel-corner-radius: var(--calcite-corner-radius-sm);
    }

    calcite-shell {
      background-size: 16px 16px;
      background-color: var(--calcite-color-surface-highlight);
      background-image: radial-gradient(
        circle,
        var(--calcite-color-brand) 1px,
        transparent 1px
      );
    }

    .content-container {
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
    }

    img[slot="content-start"] {
      height: 1.25rem;
      align-self: center;
      margin-inline: 0.25rem;
    }

    calcite-block {
      margin-block: 0;
      --calcite-font-size--1: 1rem;
      --calcite-block-padding: 0.75rem;
      --calcite-block-toggle-icon-color: transparent;
      --calcite-block-toggle-icon-color-hover: transparent;
    }

    calcite-block calcite-list-item {
      --calcite-font-size--1: 0.875rem;
    }

    calcite-link {
      display: block;
      font-size: 0.875rem;
      margin: 1.25rem auto 0.5rem;
      text-align: center;
    }

    calcite-block > calcite-link.outside-block {
      margin-top: 0.5rem;
    }

    calcite-list {
      border: 1px solid var(--calcite-color-border-3);
    }

    calcite-list-item {
      --calcite-font-size--2: 0.875rem;
    }

    calcite-block[icon-start="circle-f"] {
      --calcite-block-icon-color: var(--calcite-color-brand);
    }
  </style>
</head>

<body>
  <calcite-shell>
    <calcite-panel heading="Sign in to AcmeCo" class="content-panel">
      <div class="content-container">
        <calcite-block-group expand-mode="single-persist">
          <calcite-block
            expanded
            expandable
            heading="Use your credentials"
            icon-start="circle-f"
          >
            <calcite-action
              slot="control"
              icon="question"
              id="tooltip-toggle"
            ></calcite-action>
            <calcite-tooltip
              slot="control"
              placement="bottom"
              reference-element="tooltip-toggle"
            >
              Sign in with your email and password
            </calcite-tooltip>
            <calcite-label>
              <calcite-input icon="user" placeholder="Username"></calcite-input>
            </calcite-label>
            <calcite-label>
              <calcite-input
                icon
                type="password"
                placeholder="Password"
              ></calcite-input>
            </calcite-label>
            <calcite-label layout="inline">
              <calcite-checkbox></calcite-checkbox> Keep me signed in
            </calcite-label>
            <calcite-button width="full">Sign in</calcite-button>
            <calcite-link>Forgot username or password?</calcite-link>
          </calcite-block>
          <calcite-block
            expandable
            heading="Use your organization URL"
            icon-start="circle"
          >
            <calcite-label>
              <calcite-input
                placeholder="Organization name"
                suffix-text=".maps.acmeco.com"
              >
              </calcite-input>
            </calcite-label>
            <calcite-button width="full">Continue</calcite-button>
          </calcite-block>
          <calcite-block
            expandable
            heading="Use social authentication"
            icon-start="circle"
          >
            <calcite-list>
              <calcite-list-item label="Continue with Facebook"
                ><img
                  slot="content-start"
                  src="https://upload.wikimedia.org/wikipedia/en/0/04/Facebook_f_logo_%282021%29.svg"
                  draggable="false"
                />
                <calcite-icon
                  scale="s"
                  slot="content-end"
                  icon="chevron-right"
                ></calcite-icon>
              </calcite-list-item>
              <calcite-list-item label="Continue with Google"
                ><img
                  slot="content-start"
                  src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"
                  draggable="false"
                />
                <calcite-icon
                  scale="s"
                  slot="content-end"
                  icon="chevron-right"
                ></calcite-icon>
              </calcite-list-item>
              <calcite-list-item label="Continue with GitHub"
                ><img
                  slot="content-start"
                  src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg"
                  draggable="false"
                />
                <calcite-icon
                  scale="s"
                  slot="content-end"
                  icon="chevron-right"
                ></calcite-icon>
              </calcite-list-item>
            </calcite-list>
          </calcite-block>
        </calcite-block-group>
        <calcite-link class="outside-block">Create an account</calcite-link>
      </div>
    </calcite-panel>
  </calcite-shell>
</body>

<script type="module">
  const blocks = document.querySelectorAll("calcite-block");

  function updateIcon(event) {
    const block = event.target;
    block.iconStart = block.expanded ? "circle-f" : "circle";
  }

  blocks.forEach((block) => {
    block.addEventListener("calciteBlockExpand", updateIcon);
    block.addEventListener("calciteBlockCollapse", updateIcon);
  });
</script>
